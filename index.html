<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tempsens IPO Form Editor</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">📄</span>
        <span class="logo-text">PDF Form Editor</span>
      </div>
      <p class="subtitle">Tempsens IPO Application</p>
    </div>

    <div class="sidebar-body">

      <div class="section">
        <h3>👤 Personal Details</h3>
        <label>Full Name
          <input type="text" id="name" placeholder="PATEL DINESHKUMAR CHIMANLAL" />
        </label>
        <label>Address
          <textarea id="address" rows="2" placeholder="A-202 HOME TOWN-2 NEAR KHODIYARMATA MANDIR NEW RANIP"></textarea>
        </label>
        <label>City
          <input type="text" id="city" placeholder="AHMEDABAD CITY" />
        </label>
        <label>Email
          <input type="email" id="email" placeholder="dc9909496434@gmail.com" />
        </label>
        <label>Mobile
          <input type="text" id="phone" placeholder="9909496434" maxlength="10" />
        </label>
        <label>PAN No.
          <input type="text" id="pan" placeholder="BBAPP1963P" maxlength="10" style="text-transform:uppercase" />
        </label>
      </div>

      <div class="section">
        <h3>🏦 Depository Details</h3>
        <label>DP ID / Client ID
          <input type="text" id="dpid" placeholder="1203600010556002" />
        </label>
        <label>Bidder Depository A/c No.
          <input type="text" id="depo_ac" placeholder="1203600010556002" />
        </label>
      </div>

      <div class="section">
        <h3>📊 Bid Options</h3>
        <label>Option 1 – No. of Equity Shares
          <input type="number" id="opt1_shares" placeholder="50" />
        </label>
        <label>Option 1 – Bid Price (₹)
          <input type="number" id="opt1_price" placeholder="300" />
        </label>
      </div>

      <div class="section">
        <h3>💰 Payment Details</h3>
        <label>Amount Blocked (Figures)
          <input type="number" id="amount_fig" placeholder="15000" />
        </label>
        <label>Amount Blocked (Words)
          <input type="text" id="amount_words" placeholder="FIFTEEN THOUSAND ONLY" />
        </label>
        <label>ASBA Bank A/c No.
          <input type="text" id="asba_ac" placeholder="422302010158599" />
        </label>
        <label>Bank Name & Branch
          <input type="text" id="bank_name" placeholder="UNION BANK OF INDIA" />
        </label>
      </div>

      <div class="section">
        <h3>🧾 Applicant / Holder</h3>
        <label>Name of Sole / First Holder
          <input type="text" id="holder_name" placeholder="PATEL DINESHKUMAR CHIMANLAL" />
        </label>
      </div>

      <button id="fillBtn" class="btn-primary">⚡ Fill PDF</button>
      <button id="saveBtn" class="btn-secondary" disabled>💾 Save / Download PDF</button>
      <button id="resetBtn" class="btn-ghost">🔄 Reset</button>
    </div>
  </aside>

  <!-- VIEWER -->
  <main class="viewer">
    <div class="viewer-toolbar">
      <span id="status">Load karein... PDF load ho raha hai</span>
      <div class="zoom-controls">
        <button id="zoomOut">−</button>
        <span id="zoomVal">100%</span>
        <button id="zoomIn">+</button>
      </div>
    </div>
    <div class="pdf-container">
      <div id="pdfViewer"></div>
    </div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
